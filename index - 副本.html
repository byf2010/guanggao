<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18禁视频网站广告位招租</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #fff;
      background: #07070b;
    }

    .ad-page {
      position: relative;
      width: min(1200px, calc(100vw - 32px));
      height: 600px;
      overflow: hidden;
      border-radius: 10px;
      background:
        linear-gradient(90deg, rgba(7, 7, 11, 0.96) 0%, rgba(19, 15, 26, 0.92) 42%, rgba(83, 18, 43, 0.65) 100%),
        radial-gradient(circle at 75% 30%, rgba(255, 54, 113, 0.48), transparent 34%),
        radial-gradient(circle at 86% 74%, rgba(255, 174, 66, 0.28), transparent 28%),
        #0c0b11;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.9));
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 34px;
      height: 100%;
      padding: 42px 48px;
    }

    .left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .tag {
      width: fit-content;
      margin-bottom: 18px;
      padding: 7px 12px;
      color: #ffd8e5;
      background: rgba(255, 54, 113, 0.16);
      border: 1px solid rgba(255, 88, 139, 0.34);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      max-width: 610px;
      font-size: clamp(42px, 5.6vw, 74px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      max-width: 560px;
      margin: 20px 0 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 18px;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: #ff3671;
      box-shadow: 0 14px 34px rgba(255, 54, 113, 0.34);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 34px;
      max-width: 560px;
    }

    .stat {
      padding: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    .stat strong {
      display: block;
      font-size: 26px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
    }

    .right {
      display: grid;
      align-content: center;
      gap: 14px;
      min-width: 0;
    }

    .screen {
      position: relative;
      min-height: 300px;
      padding: 18px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .browser {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 20px;
      margin-bottom: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.36);
    }

    .mock-layout {
      display: grid;
      grid-template-columns: 1fr 116px;
      gap: 12px;
    }

    .video-box {
      display: grid;
      place-items: center;
      min-height: 196px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 54, 113, 0.38), rgba(255, 174, 66, 0.22)),
        rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.86);
      font-weight: 800;
      font-size: 18px;
    }

    .side-ads {
      display: grid;
      gap: 10px;
    }

    .side-ad,
    .banner-ad {
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 54, 113, 0.24);
      border: 1px dashed rgba(255, 255, 255, 0.36);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .side-ad {
      min-height: 93px;
    }

    .banner-ad {
      min-height: 54px;
      margin-top: 12px;
      background: rgba(255, 174, 66, 0.2);
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .plan {
      padding: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .plan b {
      display: block;
      font-size: 15px;
    }

    .plan span {
      display: block;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.64);
      font-size: 12px;
    }

    .plan strong {
      display: block;
      margin-top: 9px;
      color: #ffcf7a;
      font-size: 20px;
    }

    .notice {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      body {
        place-items: start center;
        padding: 16px 0;
      }

      .ad-page {
        height: auto;
        min-height: 600px;
      }

      .content {
        grid-template-columns: 1fr;
        padding: 30px 22px;
      }

      .stats,
      .plans {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .mock-layout {
        grid-template-columns: 1fr;
      }

      .side-ads {
        grid-template-columns: 1fr 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="ad-page">
    <div class="grid" aria-hidden="true"></div>
    <section class="content">
      <div class="left">
        <div class="tag">成人流量 · 广告位招租中</div>
        <h1>18禁成人流量广告位招租</h1>
        <p class="lead">面向成人内容平台、交友产品、品牌工具、游戏推广和联盟广告开放核心展示位。支持顶部横幅、播放页贴片、侧栏推荐和包月独家投放。</p>
        <div class="actions">
          <a class="btn btn-primary" href="https://t.me/BoBoM100">立即预订档期</a>
          <a class="btn btn-ghost" href="https://t.me/BoBoM100">查看广告位报价</a>
        </div>
        <div class="stats">
          <div class="stat">
            <strong>600px</strong>
            <span>页面固定展示高度</span>
          </div>
          <div class="stat">
            <strong>4类</strong>
            <span>核心广告位置</span>
          </div>
          <div class="stat">
            <strong>24h</strong>
            <span>素材审核上线</span>
          </div>
        </div>
        <p class="notice">广告内容需合法合规，禁止未成年人、诱导欺诈、违法交易及侵权素材。</p>
      </div>

      <div class="right" id="plans">
        <div class="screen">
          <div class="browser">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="mock-layout">
            <div>
              <div class="video-box">广告位招租</div>
              <div class="banner-ad">广告位招租</div>
            </div>
            <div class="side-ads">
              <div class="side-ad">广告位招租</div>
              <div class="side-ad">广告位招租</div>
            </div>
          </div>
        </div>

        <div class="plans">
          <div class="plan">
            <b>顶部横幅</b>
            <span>强曝光 / 首页首屏</span>
            <strong>¥500/月</strong>
          </div>
          <div class="plan">
            <b>播放页贴片</b>
            <span>高点击 / 内容路径</span>
            <strong>¥300/月</strong>
          </div>
          <div class="plan">
            <b>侧栏包位</b>
            <span>长期露出 / 独家可谈</span>
            <strong>¥300/月</strong>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
